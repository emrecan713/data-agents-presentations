<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <title>Example data: count per category</title>
  <rect width="720" height="400" fill="#ffffff"/>
  <g stroke="#000000" stroke-width="2">
    <line x1="80" y1="340" x2="690" y2="340"/>
    <line x1="80" y1="40" x2="80" y2="340"/>
  </g>
  <g fill="#5a5a5a" font-size="18" text-anchor="end">
    <text x="70" y="346">0</text>
    <text x="70" y="246">10</text>
    <text x="70" y="146">20</text>
  </g>
  <g stroke="#dcdcdc" stroke-width="1">
    <line x1="82" y1="240" x2="690" y2="240"/>
    <line x1="82" y1="140" x2="690" y2="140"/>
  </g>
  <g fill="#000000">
    <rect x="120" y="220" width="100" height="120"/>
    <rect x="270" y="150" width="100" height="190" fill="#f7e159" stroke="#000" stroke-width="2"/>
    <rect x="420" y="270" width="100" height="70"/>
    <rect x="570" y="190" width="100" height="150"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#000000">
    <text x="170" y="372">A</text>
    <text x="320" y="372">B</text>
    <text x="470" y="372">C</text>
    <text x="620" y="372">D</text>
    <text x="170" y="208" font-weight="700">12</text>
    <text x="320" y="138" font-weight="700">19</text>
    <text x="470" y="258" font-weight="700">7</text>
    <text x="620" y="178" font-weight="700">15</text>
  </g>
</svg>
